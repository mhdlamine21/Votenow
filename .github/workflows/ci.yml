name: CI/CD VoteNow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  lint-php:
    name: Lint PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, fileinfo, gd

      - name: Verifier la syntaxe PHP
        run: |
          echo "Verification de la syntaxe PHP..."
          find . -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/node_modules/*" \
            | xargs -I {} php -l {}
          echo "Tous les fichiers PHP sont syntaxiquement valides."

      - name: Verifier que .env n'est pas committe
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo "ERREUR : .env est committe dans git ! Veuillez le retirer du depot."
            exit 1
          fi
          echo "OK : .env absent du depot."

  validate-sql:
    name: Validate SQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: votenow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verifier presence de database.sql
        run: |
          test -f database.sql && echo "OK : database.sql present" || (echo "ERREUR : database.sql manquant" && exit 1)

      - name: Importer le schema SQL
        run: |
          mysql -h 127.0.0.1 -u root -proot_test votenow_test < database.sql
          echo "OK : Schema SQL importe avec succes."

      - name: Verifier les tables principales
        run: |
          TABLES=$(mysql -h 127.0.0.1 -u root -proot_test votenow_test -e "SHOW TABLES;" -s --skip-column-names | tr '\n' ' ')
          echo "Tables detectees : $TABLES"
          for TABLE in ufr filieres niveaux_filiere etudiants_autorises utilisateurs admins elections candidatures votes participations notifications logs demandes_profil settings decision_admin; do
            if echo "$TABLES" | grep -qw "$TABLE"; then
              echo "OK : table $TABLE"
            else
              echo "ERREUR : table $TABLE manquante"
              exit 1
            fi
          done
          echo "Toutes les tables requises sont presentes."

      - name: Importer les donnees de test
        run: |
          mysql -h 127.0.0.1 -u root -proot_test votenow_test < test_data.sql
          echo "OK : Donnees de test importees avec succes."

      - name: Verifier les donnees de test
        run: |
          COUNT=$(mysql -h 127.0.0.1 -u root -proot_test votenow_test -e "SELECT COUNT(*) FROM admins WHERE username='superadmin';" -s --skip-column-names)
          if [ "$COUNT" = "1" ]; then
            echo "OK : Compte superadmin present."
          else
            echo "ERREUR : Compte superadmin absent."
            exit 1
          fi

  tests-php:
    name: Tests PHP
    runs-on: ubuntu-latest
    needs: [lint-php, validate-sql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: votenow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, fileinfo, gd

      - name: Initialiser la base de test
        run: |
          mysql -h 127.0.0.1 -u root -proot_test votenow_test < database.sql
          mysql -h 127.0.0.1 -u root -proot_test votenow_test < test_data.sql

      - name: Creer .env de test
        run: |
          cat > .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_NAME=votenow_test
          DB_USER=root
          DB_PASS=root_test
          APP_ENV=testing
          APP_KEY=test_key_32_characters_minimum_x
          EOF

      - name: Executer le setup
        run: |
          php scripts/setup.php
          echo "Setup VoteNow valide."

      - name: Lancer les tests unitaires (si PHPUnit present)
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --testdox
          else
            echo "PHPUnit non configure pour l'instant - validation structurelle reussie."
          fi

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-php, validate-sql]
    if: hashFiles('Dockerfile') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Creer .env temporaire pour le build
        run: |
          cp .env.example .env
          echo "APP_ENV=ci" >> .env

      - name: Build image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: votenow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-php, validate-sql, tests-php]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub (optionnel)
        if: env.DOCKER_USERNAME != '' && hashFiles('Dockerfile') != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image Docker Hub
        if: env.DOCKER_USERNAME != '' && hashFiles('Dockerfile') != ''
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/votenow:latest
            ${{ secrets.DOCKER_USERNAME }}/votenow:${{ github.sha }}

      - name: Deployer sur serveur via SSH
        if: env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/votenow
            git pull origin main
            echo "Deploiement termine : $(date)"

      - name: Notification deploiement
        if: always()
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$PROD_URL" ]; then
            echo "Deploiement effectue sur : $PROD_URL"
          else
            echo "Deploiement effectue"
          fi
          echo "Commit : ${{ github.sha }}"
          echo "Auteur : ${{ github.actor }}"
          echo "Status : ${{ job.status }}"
